<!DOCTYPE html>
<html lang="mn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}NINO SHOP{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-shop.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><nav class="navbar navbar-light bg-light"><div class="container"><a class="navbar-brand fw-bold" href="{{ url_for('index') }}">NINO<span>SHOP</span></a><div class="nav-links">{% for endpoint,label in [('index','Нүүр'),('store','Бараа'),('product_detail','Дэлгэрэнгүй'),('cart','Сагс')] %}<a {% if request.endpoint == endpoint %}aria-current="page"{% endif %} href="{{ url_for(endpoint) }}">{{ label }}</a>{% endfor %}</div></div></nav>
<main>{% block content %}{% endblock %}</main><footer><div class="container">NINO SHOP · Flask лаборатори <a href="{{ url_for('hello') }}">Мэндчилгээний жишээ →</a></div></footer></body></html>
