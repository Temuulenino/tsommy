<div class="row g-4">{% for product in products %}<div class="col-sm-6 col-lg-4"><article class="card h-100"><a href="{{ url_for('product_detail', product_id=product.id) }}"><img class="card-img-top" src="{{ url_for('static', filename='images/' + product.image) }}" alt="{{ product.name }}"></a><div class="card-body"><p class="eyebrow">NINO ESSENTIALS</p><h2 class="h5">{{ product.name }}</h2><p>{{ product.price | money }}</p><a class="btn btn-outline-dark" href="{{ url_for('product_detail', product_id=product.id) }}">Дэлгэрэнгүй →</a></div></article></div>{% endfor %}</div>
